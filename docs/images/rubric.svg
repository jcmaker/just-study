<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="100점 루브릭 배점: 권위 25점, 교차 검증 25점, 적합성 20점, 교육 품질 15점, 최신성 10점, 접근성 5점. 총점 80점 미만인 자료는 선정하지 않습니다.">
  <title>고정 루브릭 100점</title>

  <!-- Focus theme: white paper, black ink, red primary, yellow accent, zero radius. -->
  <rect width="1280" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="1280" height="440" fill="none" stroke="#000000" stroke-width="16"/>

  <g font-family="'SF Mono', 'Courier New', monospace" font-size="14" font-weight="600" letter-spacing="2">
    <text x="76" y="70" fill="#4a4a4a">배점 — 조사 전에 확정하고, 이 기준으로만 채점</text>
  </g>

  <!-- ── stacked allocation bar: 1128px wide = 100 points, 11.28px per point ── -->
  <g transform="translate(76, 96)">

    <!-- 권위 25 -->
    <rect x="0" y="0" width="282" height="84" fill="#000000"/>
    <text x="141" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">25</text>
    <text x="141" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">권위</text>

    <!-- 교차 검증 25 -->
    <rect x="282" y="0" width="282" height="84" fill="#c60000"/>
    <text x="423" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">25</text>
    <text x="423" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">교차 검증</text>

    <!-- 적합성 20 -->
    <rect x="564" y="0" width="226" height="84" fill="#ffd84a"/>
    <text x="677" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#000000" text-anchor="middle">20</text>
    <text x="677" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">적합성</text>

    <!-- 교육 품질 15 -->
    <rect x="790" y="0" width="169" height="84" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <text x="874" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#000000" text-anchor="middle">15</text>
    <text x="874" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">교육 품질</text>

    <!-- 최신성 10 -->
    <rect x="959" y="0" width="113" height="84" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <text x="1015" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#000000" text-anchor="middle">10</text>
    <text x="1015" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">최신성</text>

    <!-- 접근성 5 -->
    <rect x="1072" y="0" width="56" height="84" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <text x="1100" y="40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#000000" text-anchor="middle">5</text>
    <text x="1100" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">접근</text>

    <!-- half-mark callout: authority + cross-validation = 50 -->
    <path d="M0 100 V 116 H 564 V 100" stroke="#000000" stroke-width="3" fill="none"/>
    <text x="282" y="140" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="middle">출처의 신뢰도만으로 절반 — 50점</text>
  </g>

  <!-- ── separate axis: a source's own total, and the cut line ──────── -->
  <g transform="translate(76, 276)">
    <text x="0" y="0" font-family="'SF Mono', 'Courier New', monospace" font-size="14" font-weight="600" letter-spacing="2" fill="#4a4a4a">자료 한 건의 총점 — 선정 기준선</text>

    <!-- track -->
    <rect x="0" y="20" width="1128" height="36" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <!-- rejected zone 0–80 -->
    <rect x="4" y="24" width="894" height="28" fill="#eeeeee"/>
    <text x="451" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4a4a4a" text-anchor="middle">선정하지 않음</text>
    <!-- accepted zone 80–100 -->
    <rect x="898" y="24" width="226" height="28" fill="#c60000"/>
    <text x="1011" y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">선정 가능</text>

    <!-- cut marker -->
    <path d="M898 12 V 68" stroke="#000000" stroke-width="4"/>
    <text x="898" y="90" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#000000" text-anchor="middle">80</text>

    <g font-family="'SF Mono', 'Courier New', monospace" font-size="13" fill="#4a4a4a">
      <text x="0" y="90" text-anchor="start">0</text>
      <text x="1128" y="90" text-anchor="end">100</text>
    </g>
  </g>

  <g font-family="'SF Mono', 'Courier New', monospace" font-size="14" font-weight="600">
    <rect x="76" y="392" width="10" height="10" fill="#c60000"/>
    <text x="100" y="402" fill="#4a4a4a">좋은 자료가 부족하면 기준을 낮추는 대신 점수와 한계를 그대로 보여 줍니다.</text>
  </g>
</svg>
